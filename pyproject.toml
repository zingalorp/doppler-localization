[project]
name = "doppler-loc"
version = "0.1.1"
description = "Locate an audio recording from the Doppler curves of passing aircraft."
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "av>=18.1.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pyproj>=3.7.2",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doppler_loc"]
